<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7efe3" />
    <title>暖日待辦</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">TODAY, GENTLY</p>
        <h1>暖日待辦</h1>
        <p class="subtitle">把今天想完成的事，輕輕放在這裡。</p>
      </header>

      <section class="composer" aria-labelledby="composer-title">
        <h2 id="composer-title" class="sr-only">新增任務</h2>
        <form id="task-form" novalidate>
          <div class="field field-task">
            <label for="task-input">任務內容</label>
            <input
              id="task-input"
              name="task"
              type="text"
              maxlength="200"
              placeholder="例如：整理本週工作筆記"
              autocomplete="off"
              required
            />
            <p id="task-error" class="field-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="category-select">分類</label>
            <select id="category-select" name="category">
              <option value="work">工作</option>
              <option value="life">生活</option>
            </select>
          </div>

          <div class="field">
            <label for="assignee-input">負責人 <span>選填</span></label>
            <input
              id="assignee-input"
              name="assignee"
              type="text"
              maxlength="60"
              placeholder="輸入姓名"
              autocomplete="off"
            />
          </div>

          <button class="add-button" type="submit">
            <span aria-hidden="true">＋</span> 新增任務
          </button>
        </form>
      </section>

      <section class="tasks-section" aria-labelledby="tasks-title">
        <div class="section-heading">
          <div>
            <h2 id="tasks-title">我的任務</h2>
            <p id="task-summary" aria-live="polite">目前沒有任務</p>
          </div>

          <div class="filters" role="group" aria-label="篩選任務分類">
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
            <button class="filter-button" type="button" data-filter="work" aria-pressed="false">工作</button>
            <button class="filter-button" type="button" data-filter="life" aria-pressed="false">生活</button>
          </div>
        </div>

        <ul id="task-list" class="task-list" aria-label="待辦任務"></ul>

        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">☀</div>
          <h3>今天還沒有任務</h3>
          <p>從上方新增一件想完成的事吧。</p>
        </div>
      </section>
    </main>
  </body>
</html>
