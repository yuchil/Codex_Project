<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7efe3" />
    <title>暖日待辦</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">TODAY, GENTLY</p>
        <h1>暖日待辦</h1>
        <p class="subtitle">把今天想完成的事，輕輕放在這裡。</p>
      </header>

      <section class="composer" aria-labelledby="composer-title">
        <h2 id="composer-title" class="sr-only">新增任務</h2>
        <form id="task-form" novalidate>
          <div class="field field-task">
            <label for="task-input">任務內容</label>
            <input
              id="task-input"
              name="task"
              type="text"
              maxlength="200"
              placeholder="例如：整理本週工作筆記"
              autocomplete="off"
              required
            />
            <p id="task-error" class="field-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="category-select">分類</label>
            <select id="category-select" name="category">
              <option value="work">工作</option>
              <option value="life">生活</option>
            </select>
          </div>

          <div class="field">
            <label for="priority-select">優先程度</label>
            <select id="priority-select" name="priority">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>

          <div class="field">
            <label for="assignee-input">負責人 <span>選填</span></label>
            <input
              id="assignee-input"
              name="assignee"
              type="text"
              maxlength="60"
              placeholder="輸入姓名"
              autocomplete="off"
            />
          </div>

          <button class="add-button" type="submit">
            <span aria-hidden="true">＋</span> 新增任務
          </button>
        </form>
      </section>

      <section class="board-section" aria-labelledby="tasks-title">
        <div class="section-heading">
          <div>
            <h2 id="tasks-title">我的任務</h2>
            <p id="task-summary" aria-live="polite">目前沒有任務</p>
          </div>

          <div class="filters" role="group" aria-label="篩選任務分類">
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
            <button class="filter-button" type="button" data-filter="work" aria-pressed="false">工作</button>
            <button class="filter-button" type="button" data-filter="life" aria-pressed="false">生活</button>
          </div>
        </div>

        <div class="board" aria-label="任務看板">
          <section class="board-column column-todo" data-status="todo" aria-labelledby="todo-title">
            <header class="column-header"><div class="column-title-wrap"><span class="column-dot" aria-hidden="true"></span><h3 id="todo-title">To-do</h3></div><span class="column-count" data-count="todo" aria-label="0 件任務">0</span></header>
            <div class="column-dropzone" data-dropzone="todo"><ul class="task-list" data-list="todo" aria-label="To-do 任務"></ul><div class="column-empty" data-empty="todo"><span aria-hidden="true">＋</span><p>等待開始的任務</p></div></div>
          </section>
          <section class="board-column column-process" data-status="process" aria-labelledby="process-title">
            <header class="column-header"><div class="column-title-wrap"><span class="column-dot" aria-hidden="true"></span><h3 id="process-title">Process</h3></div><span class="column-count" data-count="process" aria-label="0 件任務">0</span></header>
            <div class="column-dropzone" data-dropzone="process"><ul class="task-list" data-list="process" aria-label="Process 任務"></ul><div class="column-empty" data-empty="process"><span aria-hidden="true">↻</span><p>正在進行的任務</p></div></div>
          </section>
          <section class="board-column column-done" data-status="done" aria-labelledby="done-title">
            <header class="column-header"><div class="column-title-wrap"><span class="column-dot" aria-hidden="true"></span><h3 id="done-title">Done</h3></div><span class="column-count" data-count="done" aria-label="0 件任務">0</span></header>
            <div class="column-dropzone" data-dropzone="done"><ul class="task-list" data-list="done" aria-label="Done 任務"></ul><div class="column-empty" data-empty="done"><span aria-hidden="true">✓</span><p>已完成的任務</p></div></div>
          </section>
        </div>
        <p id="board-announcement" class="sr-only" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
